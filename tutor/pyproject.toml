[project]
name = "tutor"
version = "0.1.0"
description = "Drona CLI: file-grounded course tutor (OKF ingestion + Groq chatbot)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling==2.126.0",
  "httpx>=0.28,<0.29",
  "python-frontmatter==1.3.0",
  "rank-bm25==0.2.2",
  "pypdf>=6,<7",
  "python-dotenv>=1.2.3",
  "streamlit>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drona"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["integration: requires local external services", "slow: exercises Docling OCR"]
testpaths = ["tests"]
