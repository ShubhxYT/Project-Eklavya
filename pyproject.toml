[project]
name = "eklavya"
version = "0.1.0"
description = "Project Eklavya: behavior-aware, file-grounded voice tutor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pipecat-ai[daily,groq,runner,silero,webrtc]>=1.8.1",
    "python-dotenv>=1.2.3",
    "python-frontmatter==1.3.0",
    "rank-bm25==0.2.2",
    "twilio>=9.11.0",
]

[project.optional-dependencies]
# Ingestion is a dev/offline tool: Docling caps at Python <3.13, so it is not
# installed in the production image or the default `uv sync`.
ingest = [
    "docling==2.126.0",
    "pypdf>=6,<7",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
eklavya-call = "eklavya.telephony:main"
eklavya-ingest = "eklavya.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
